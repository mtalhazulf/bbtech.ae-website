services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi_dev_only
    ports:
      - "5433:5432"
    volumes:
      - strapi_postgres_data:/var/lib/postgresql/data

volumes:
  strapi_postgres_data:
